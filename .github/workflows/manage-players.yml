name: Manage Players

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Aktion"
        required: true
        type: choice
        options:
          - add
          - remove
      nickname:
        description: "FACEIT Nickname des Spielers"
        required: true
        type: string

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write

    steps:
    - name: Repository auschecken
      uses: actions/checkout@v4

    - name: Node.js einrichten
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm

    - name: Abhängigkeiten installieren
      run: npm ci

    - name: Spieler ${{ inputs.action }}
      env:
        FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
      run: node manage-players.js ${{ inputs.action }} "${{ inputs.nickname }}"

    - name: Änderungen committen und pushen
      run: |
        git config user.name "faceit-bot"
        git config user.email "faceit-bot@localhost"
        git add players.txt
        git diff --cached --quiet && exit 0
        git commit -m "chore: Spieler ${{ inputs.action }}: ${{ inputs.nickname }}"
        git push

    - name: Dashboard-Update triggern
      if: success()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh workflow run "FACEIT ELO Auto Update"
